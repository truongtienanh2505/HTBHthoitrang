<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tracking Đơn Hàng</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 800px; margin: 40px auto; background: #fff; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        
        .search-box { display: flex; gap: 10px; margin-bottom: 30px; }
        .search-box input { flex: 1; padding: 12px; border: 1px solid #ddd; border-radius: 8px; outline: none; }
        .search-box button { padding: 12px 25px; background: #3498db; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        
        /* UI STATE MACHINE / TIMELINE */
        .timeline { display: flex; justify-content: space-between; position: relative; margin: 40px 0; }
        .timeline::before { content: ''; position: absolute; top: 15px; left: 0; width: 100%; height: 4px; background: #eee; z-index: 1; }
        .timeline-progress { position: absolute; top: 15px; left: 0; height: 4px; background: #2ecc71; z-index: 2; transition: 0.5s; width: 0%; }
        
        .step { position: relative; z-index: 3; text-align: center; width: 25%; }
        .step .circle { width: 30px; height: 30px; background: #eee; border-radius: 50%; margin: 0 auto 10px; line-height: 30px; font-weight: bold; color: #aaa; border: 4px solid #fff; transition: 0.3s; }
        .step.active .circle { background: #2ecc71; color: white; }
        .step .label { font-size: 14px; font-weight: 600; color: #888; }
        .step.active .label { color: #2c3e50; }

        /* Lịch sử chi tiết */
        .history-table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        .history-table th, .history-table td { padding: 12px; text-align: left; border-bottom: 1px solid #eee; }
        .history-table th { background: #f9f9f9; }
    </style>
</head>
<body>

    <div class="container">
        <h2 style="text-align: center;">📦 Theo Dõi Đơn Hàng</h2>
        
        <div class="search-box">
            <input type="text" id="orderId" placeholder="Nhập mã đơn hàng (VD: DH0099)..." value="DH0099">
            <button onclick="trackOrder()">Tra Cứu</button>
        </div>

        <div id="trackingResult" style="display: none;">
            <h3 style="border-bottom: 2px solid #eee; padding-bottom: 10px;">Đơn hàng: <span id="displayOrderId" style="color: #e74c3c;"></span></h3>
            
            <div class="timeline">
                <div class="timeline-progress" id="progressLine"></div>
                <div class="step" id="step1"><div class="circle">1</div><div class="label">Chờ Xác Nhận</div></div>
                <div class="step" id="step2"><div class="circle">2</div><div class="label">Đã Xác Nhận</div></div>
                <div class="step" id="step3"><div class="circle">3</div><div class="label">Đang Giao</div></div>
                <div class="step" id="step4"><div class="circle">4</div><div class="label">Thành Công</div></div>
            </div>

            <h4>Chi tiết lịch sử:</h4>
            <table class="history-table">
                <thead>
                    <tr>
                        <th>Thời gian</th>
                        <th>Trạng thái</th>
                        <th>Ghi chú</th>
                    </tr>
                </thead>
                <tbody id="historyBody">
                    </tbody>
            </table>
        </div>
    </div>

    <script src="tracking.js"></script>
</body>
</html>
